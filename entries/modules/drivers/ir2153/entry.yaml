summary: >-
  Infineon / International Rectifier 600V self-oscillating half-bridge gate driver IC incorporating a front-end oscillator similar to the 555 timer, micropower startup, 1.2µs internal deadtime, and an internal 15.6V Zener clamp on VCC for driving N-channel power MOSFETs and IGBTs.
