references:
  - targetId: driver.stepper.tmc2208
    relation: companion-to
    comment: TMC2208 uses single-wire UART instead of 4-wire SPI and lacks StallGuard2 sensorless homing.
  - targetId: driver.stepper.tmc2209
    relation: companion-to
    comment: TMC2209 features single-wire UART, higher current (2.0A RMS), and StallGuard4, whereas TMC2130 uses 4-wire SPI.
  - targetId: driver.stepper.a4988
    relation: alternative-to
    comment: Massive noise reduction, sensorless homing, and software current configuration upgrade over A4988.
