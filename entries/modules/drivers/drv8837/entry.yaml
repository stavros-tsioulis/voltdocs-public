  Texas Instruments ultra-compact low-voltage (1.8V to 11V) single H-bridge motor driver IC in a 2x2mm WSON package delivering up to 1.8A peak (1.0A RMS) with simple IN1/IN2 PWM interface and 120nA sleep current for battery-powered robotics.
