summary: >-
  Texas Instruments OPA333 precision micropower CMOS operational amplifier featuring auto-calibrating zero-drift technology (10µV max offset, 0.05µV/°C drift), 17µA quiescent current, and rail-to-rail I/O from 1.8V to 5.5V.
