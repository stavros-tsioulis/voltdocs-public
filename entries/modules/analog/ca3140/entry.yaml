  ic_part_numbers: [CA3140E, CA3140AE, CA3140M, CA3140AM]
  package: 8-pin DIP (DIP-8 / PDIP-8) / 8-pin SOIC / 8-pin TO-5 Metal Can
  opamp_type: BiMOS (MOSFET Input, Bipolar Output) Operational Amplifier
  amplifier_channels: 1 (Single)
  gain_bandwidth_mhz: 4.5
  slew_rate_v_us: 9
  input_bias_current_pa: 10
  input_impedance_ohms: 1.5e+12
  input_offset_voltage_mv: 5 (2mV on CA3140A)
  supply_voltage_min_v: 4.0 (Single Supply) / ±2.0 (Dual Supply)
  supply_voltage_max_v: 36.0 (Single Supply) / ±18.0 (Dual Supply)
  supply_current_ma: 4
  unity_gain_compensated: true
  operating_temp_min_c: -55
  operating_temp_max_c: 125
  interfaces: [8-Pin Analog (Inputs, Output, Offset Null, Strobe)]
