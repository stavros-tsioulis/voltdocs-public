id: analog.opamp.ca3140
revision: "1.0"
title: CA3140 — 4.5MHz BiMOS Operational Amplifier with MOSFET Input & Bipolar Output
category: analog/opamp
tags: [ca3140, ca3140a, ca3140e, opamp, bimos, mosfet-input, bipolar-output, renesas, intersil, rca, photodiode, transimpedance, dip-8]
status: published
summary: >-
  Renesas (Intersil/RCA) 4.5MHz BiMOS operational amplifier featuring gate-protected PMOS inputs (10pA bias current, 1.5TΩ impedance), internally unity-gain compensated bipolar output, and wide 4V–36V supply in an 8-pin DIP package.
updatedAt: "2026-08-25"
fields:
