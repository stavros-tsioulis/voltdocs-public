  slew_rate_v_us: 30 (10V/µs compensated)
  input_bias_current_pa: 5
  input_impedance_ohms: 1.5e+12
  input_offset_voltage_mv: 8 (2mV on CA3130A)
  supply_voltage_min_v: 5.0 (Single Supply) / ±2.5 (Dual Supply)
