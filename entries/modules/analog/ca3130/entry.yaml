summary: >-
  Renesas (Intersil/RCA) 15MHz BiMOS operational amplifier combining gate-protected PMOS inputs (5pA bias current, 1.5TΩ impedance) with rail-to-rail CMOS output swing in an 8-pin DIP package.
updatedAt: "2026-08-25"
