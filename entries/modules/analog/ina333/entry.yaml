title: INA333 — MicroPower (50µA) Precision Rail-to-Rail Output Instrumentation Amplifier
category: analog/inamp
tags: [ina333, ina333aidgkt, ina333aidr, inamp, instrumentation-amplifier, precision, micropower, low-power, rail-to-rail, single-supply, ecg, emg, biosignal, wearable, texas-instruments, vssop-8, soic-8]
status: published
summary: >-
  Texas Instruments ultra-low-power (50µA) precision instrumentation amplifier operating from 1.8V to 5.5V single supplies with rail-to-rail output swing, 25µV max offset, 100dB CMRR, and single resistor gain programming (1 to 1000) for battery-powered medical and wearable biosensing.
updatedAt: "2026-08-14"
