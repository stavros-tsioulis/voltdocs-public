summary: >-
  High-speed CMOS IC containing four independent 2-input NAND logic gates with TTL-compatible input switching thresholds (VIH >= 2.0V, VIL <= 0.8V), standard for interfacing 3.3V/5V TTL logic to 5V CMOS systems.
