  Microchip / Micrel 3A high-current ultra-low dropout (LDO) adjustable linear voltage regulator (370mV dropout at 3A) in a TO-263-5 (D2PAK) package, featuring logic-level enable shutdown, full fault protection, and adjustable output from 1.24V to 26V.
