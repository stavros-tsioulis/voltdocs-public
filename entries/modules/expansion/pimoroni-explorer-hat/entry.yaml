summary: >-
  Pimoroni multifunction Raspberry Pi add-on board integrating a dual H-bridge motor driver (DRV8833), 4-channel 5V analog inputs (ADS1015), 4 capacitive touch pads (CAP1204), 4 buffered 5V outputs, and status LEDs.
