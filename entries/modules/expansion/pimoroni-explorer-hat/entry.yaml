  buffered_outputs: 4 (5V sinking/sourcing 500mA total)
  capacitive_touch_pads: 4 (CAP1204 I2C touch controller)
  status_leds: 4 (Blue, Green, Yellow, Red)
  interfaces: [I2C, Raspberry Pi GPIO]
