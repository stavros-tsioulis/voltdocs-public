status: published
summary: >-
  Microchip (Atmel) high-performance 8-bit AVR RISC microcontroller with 32KB Flash, 2KB SRAM, 1KB EEPROM, 10-bit ADC, powering Arduino Uno R3 and Arduino Nano.
updatedAt: "2026-08-03"
fields:
  manufacturer: Microchip Technology / Atmel
  ic_part_numbers: [ATmega328P, ATmega328P-PU, ATmega328P-AU, ATmega328P-MU]
  package: 28-pin DIP (DIP-28) / 32-pin TQFP / 32-pin QFN
  core: 8-bit AVR RISC
  max_clock_speed_mhz: 20 (16MHz nominal on Arduino)
  flash_memory_kb: 32 (0.5KB reserved for Optiboot bootloader)
  sram_memory_kb: 2
  eeprom_memory_kb: 1
  operating_voltage_min_v: 1.8
  operating_voltage_max_v: 5.5
  gpio_count: 23
  pwm_channels: 6 (8-bit resolution)
  adc_channels: 6 (DIP) / 8 (TQFP) (10-bit resolution)
  interfaces: [UART/USART, SPI, I2C/TWI]
  operating_temp_min_c: -40
  operating_temp_max_c: 85
