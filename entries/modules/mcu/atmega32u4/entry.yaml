  Microchip (Atmel) 8-bit AVR RISC microcontroller featuring full-speed USB 2.0 controller, 32KB Flash, 2.5KB SRAM, 1KB EEPROM, and 12-channel ADC, powering Arduino Leonardo, Pro Micro, and custom mechanical keyboards.
