id: mcu.arm.stm32g030f6p6
revision: "1.0"
title: STM32G030F6P6 — Mainstream ARM Cortex-M0+ 32-Bit MCU (64MHz, 32KB Flash)
category: mcu/arm
tags: [stm32g030f6p6, stm32, arm, cortex-m0+, 32-bit, stmicroelectronics, tssop-20, 64mhz, 32kb, 8kb-ram, swd, 12-bit-adc]
status: published
summary: >-
  STMicroelectronics modern 32-bit ARM Cortex-M0+ microcontroller running at 64MHz with 32KB Flash, 8KB SRAM, 2.5Msps 12-bit ADC, motor-control timer, and hardware I2C/SPI/USART in a consolidated TSSOP-20 package.
updatedAt: "2026-08-25"
fields:
  manufacturer: STMicroelectronics
  ic_part_numbers: [STM32G030F6P6, STM32G030F6P6TR, STM32G031F6P6]
  package: 20-pin TSSOP (TSSOP-20 / 6.5 x 4.4 mm)
  core: ARM 32-bit Cortex-M0+
  max_clock_speed_mhz: 64
  flash_memory_kb: 32
  sram_memory_kb: 8 (with hardware parity check)
  operating_voltage_min_v: 2.0
  operating_voltage_max_v: 3.6
  gpio_count: 18 (Up to 16 5V-tolerant)
  adc_channels: 16 (12-bit resolution, 0.4 µs / 2.5 Msps with hardware oversampling)
  timers: 7 (1x 16-bit advanced motor-control timer, 4x 16-bit GP timers, 1x LPTIM, 1x SysTick)
  interfaces: [2x I2C (Fast Mode+ 1MHz), 2x SPI (32 Mbps), 2x USART, SWD Debug]
  operating_temp_min_c: -40
  operating_temp_max_c: 85
