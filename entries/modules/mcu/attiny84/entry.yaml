summary: >-
  Microchip (Atmel) 14-pin 8-bit AVR RISC microcontroller with 8KB Flash, 512B SRAM, 512B EEPROM, 8-channel 10-bit ADC, 16-bit timer, and 12 GPIO lines in a compact DIP-14 package.
