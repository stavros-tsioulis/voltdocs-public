  core: ARM 32-bit Cortex-M0
  max_clock_speed_mhz: 48
  flash_memory_kb: 16
  sram_memory_kb: 4
  operating_voltage_min_v: 2.4
  operating_voltage_max_v: 3.6
  gpio_count: 15 (Up to 12 5V-tolerant)
  adc_channels: 11 (12-bit resolution, 1.0 µs conversion time)
  timers: 5 (1x 16-bit advanced motor-control timer + 4x 16-bit GP timers)
  interfaces: [1x I2C (Fast Mode+ 1MHz), 1x SPI (18 Mbps), 1x USART, SWD Debug]
  operating_temp_min_c: -40
  operating_temp_max_c: 85
