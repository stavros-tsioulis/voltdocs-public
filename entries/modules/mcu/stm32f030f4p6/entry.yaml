summary: >-
  STMicroelectronics budget 32-bit ARM Cortex-M0 microcontroller running at 48MHz with 16KB Flash, 4KB SRAM, 12-bit ADC, advanced motor control timer, and hardware I2C/SPI/USART in a compact 20-pin TSSOP package.
updatedAt: "2026-08-25"
fields:
  manufacturer: STMicroelectronics
  ic_part_numbers: [STM32F030F4P6, STM32F030F4P6TR]
