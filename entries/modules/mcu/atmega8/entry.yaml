  Microchip (Atmel) classic 8-bit AVR RISC microcontroller with 8KB Flash, 1KB SRAM, 512B EEPROM, 6-channel 10-bit ADC, and hardware UART in a 28-pin DIP package, powering early Arduinos and USBasp programmers.
